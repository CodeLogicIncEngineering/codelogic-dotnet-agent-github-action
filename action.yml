name: 'Lineai .Net Agent'
description: 'Scans .Net artifacts into your Lineai server.'

branding:
  icon: 'share-2'
  color: 'blue'

inputs:
  lineai_host:
    description: 'The host address of the Lineai instance (e.g. https://mycompany.app.lineai.net), with no path suffix — the agent appends the API mount point (/api) itself.'
    required: true
  agent_uuid:
    description: 'The UUID of the Agent in Lineai.'
    required: true
  agent_password:
    description: 'The password for the agent.'
    required: true
  application_name:
    description: 'The Application node to create that will be the parent of all objects found in the scan.'
    required: true
  scan_space:
    description: 'The name of the scan space that the data will be saved to. If specified, a ScanSpace with this name will be created if not found. If not specified, information will be saved to the default ScanSpace.'
    required: false
  scan_path:
    description: 'The path of the file or directory to scan. Must start with /github/workspace/'
    default: "/github/workspace"
    required: false
  include_filter:
    description: 'Include file path filters (repeatable via comma-separated values). Maps to --include.'
    required: false
  exclusion_filter:
    description: 'Exclude file path filters. Maps to --exclude / -x.'
    required: false
  namespace_filter:
    description: 'Namespace include filter(s). Maps to --namespace. Comma-separated for multiple values.'
    required: false
  database_identities:
    description: 'Database identity or connection target(s) for remote SQL parse. Maps to --database.'
    required: false
  force_rescan:
    description: 'Forces the agent to rescan already scanned artifacts.'
    default: 'false'
    required: false
  expunge_scan_sessions:
    description: 'Instruct the server to delete all other scan sessions created by this agent and its configuration after the current scan session has completed successfully.'
    default: 'false'
    required: false


runs:
  using: 'docker'
  image: docker://lineaipublic.azurecr.io/lineai_dotnet:latest
  args: [
    "-p=${{ inputs.scan_path }}",
    "-a=${{ inputs.application_name }}",
    "${{ inputs.scan_space != null && format('-s={0}', inputs.scan_space) || null }}",
    "${{ inputs.include_filter != null && format('--include={0}', inputs.include_filter) || null }}",
    "${{ inputs.exclusion_filter != null && format('-x={0}', inputs.exclusion_filter) || null }}",
    "${{ inputs.namespace_filter != null && format('--namespace={0}', inputs.namespace_filter) || null }}",
    "${{ inputs.database_identities != null && format('--database={0}', inputs.database_identities) || null }}",
    "${{ inputs.force_rescan == 'true' && '--rescan' || null }}",
    "${{ inputs.expunge_scan_sessions == 'true' && '-e' || null }}"
  ]
  env:
    LINEAI_HOST: ${{ inputs.lineai_host }}
    AGENT_UUID: ${{ inputs.agent_uuid }}
    AGENT_PASSWORD: ${{ inputs.agent_password }}
